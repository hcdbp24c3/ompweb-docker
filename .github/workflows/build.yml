name: Auto-build Ompweb

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if versions unchanged"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/<owner>/ompweb-docker

jobs:
  check:
    name: Check for new versions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      ompweb_version: ${{ steps.versions.outputs.ompweb_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest version from npm
        id: versions
        run: |
          OMPWEB=$(npm view @kahme247/ompweb version)
          echo "ompweb_version=$OMPWEB" >> "$GITHUB_OUTPUT"
          echo "Latest ompweb: $OMPWEB"

      - name: Compare with last built version
        id: compare
        run: |
          FORCE="${{ github.event.inputs.force }}"
          OMPWEB="${{ steps.versions.outputs.ompweb_version }}"

          # Read last-built version from committed VERSIONS file (if present)
          LAST_OMPWEB=""
          if [ -f VERSIONS ]; then
            LAST_OMPWEB=$(grep -E '^OMPWEB=' VERSIONS | cut -d= -f2 || true)
          fi

          echo "Last built: ompweb=$LAST_OMPWEB"
          echo "Latest:     ompweb=$OMPWEB"

          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$OMPWEB" != "$LAST_OMPWEB" ]; then
            echo "New version detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version change. Skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & push multi-arch image
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit updated VERSIONS file
      packages: write        # to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check.outputs.ompweb_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMPWEB_VERSION=${{ needs.check.outputs.ompweb_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record built version
        run: |
          printf 'OMPWEB=%s\n' \
            "${{ needs.check.outputs.ompweb_version }}" > VERSIONS
          cat VERSIONS

      - name: Commit updated VERSIONS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump built version to ompweb ${{ needs.check.outputs.ompweb_version }}"
          file_pattern: VERSIONS
